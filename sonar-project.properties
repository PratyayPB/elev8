# SonarCloud Analysis Configuration

# Source & Test Scopes
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

# File Exclusions from Analysis
sonar.exclusions=.trigger/**,**/*.mjs,**/*.map,scripts/**,node_modules/**,.next/**,coverage/**,playwright-report/**,prisma/**,context/**

# Duplication (CPD) Exclusions
# Tests, validation schemas, and constants frequently share repetitive syntax
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/features/**/schemas/**,src/features/**/types/**,src/features/**/constants/**

# General Settings
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser,node
